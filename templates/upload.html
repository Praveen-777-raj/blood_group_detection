<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Blood Image</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            <h2>Blood Group Detection</h2>
        </div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/upload">Upload</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <!-- Upload Section -->
    <section class="upload-section">

        <h1>Upload Blood Sample Image</h1>

        <div class="upload-card">

            <!-- Form starts here -->
            <form action="/predict" method="POST" enctype="multipart/form-data">

                <input
                    type="file"
                    id="imageInput"
                    name="image"
                    accept="image/*"
                    hidden
                >

                <button
                    type="button"
                    onclick="chooseImage()"
                    class="btn">
                    Upload Image
                </button>

                <br><br>

                <img
                    id="preview"
                    src=""
                    alt="Preview"
                    style="display:none;"
                >

                <br>

                <button
                    type="button"
                    id="removeBtn"
                    class="remove-btn"
                    onclick="removeImage()"
                    style="display:none;">
                    Remove Image
                </button>

                <br><br>

                <button
                    type="submit"
                    id="detectBtn"
                    class="detect-btn"
                    style="display:none;">
                    Detect Blood Group
                </button>

            </form>
            <!-- Form ends here -->

        </div>

    </section>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
